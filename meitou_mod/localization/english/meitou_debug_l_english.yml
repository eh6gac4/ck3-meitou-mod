 meitou_debug.0101.t:0 "Higekiri: Event Testing"
 meitou_debug.0101.desc:0 "The introduction bypasses location, travel, and the encounter timer once. Acquired swords cannot be generated again; load a save from before acquisition to repeat the test.\n\nOpen the trial directly to test the already-claimed exit. Ending previews do not change the save state."
 meitou_debug.0201.t:0 "Higekiri: Reset Encounter Timer"
 meitou_debug.0201.desc:0 "Clear only the current character's 180-day encounter timer. The world acquisition record and existing artifact remain unchanged. Load a save from before acquisition to repeat the test."
