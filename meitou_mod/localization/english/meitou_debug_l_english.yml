 meitou_debug.0106.t:0 "Odenta Mitsuyo: Event Test"
 meitou_debug.0106.desc:0 "The introduction bypasses location, travel, and cooldown requirements once. An already acquired sword cannot be generated again. Load a save from before acquisition to repeat the trial.\n\nOpening the trial directly also checks the unavailable path. Viewing only the success or failure text does not change the save."
