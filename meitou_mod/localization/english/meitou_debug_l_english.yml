l_english:
 meitou_debug_decision:0 "Debug famous sword events"
 meitou_debug_decision_desc:0 "Choose a sword to test its events. Acquisition and costs affect your save; use a test save."
 meitou_debug_decision_tooltip:0 "Open the sword debug menu"
 meitou_debug_decision_confirm:0 "Open"
 meitou_debug.0001.t:0 "Famous Sword Debug Menu"
 meitou_debug.0001.desc:0 "Choose a sword. Introductions and trials can be opened without traveling. Ending previews have no rewards or costs.\n\nTrials and forced outcomes change artifacts, acquisition records, or stress. Finish one event before starting another."
 meitou_debug.close:0 "Close"
 meitou_debug.back:0 "Back to sword selection"
 meitou_debug.intro:0 "Start introduction (unclaimed swords only)"
 meitou_debug.trial:0 "Open trial (real rewards and costs)"
 meitou_debug.success_preview:0 "Preview success text only"
 meitou_debug.failure_preview:0 "Preview failure text only"
 meitou_debug.reset:0 "Reset the 180-day encounter timer..."
 meitou_debug.reset_confirm:0 "Clear the encounter timer"
 meitou_debug.cancel:0 "Return without resetting"
 meitou_debug.gold:0 "Add 100 gold for testing"
 meitou_debug.force_success:0 "[Debug] Execute successful acquisition"
 meitou_debug.force_failure:0 "[Debug] Execute failure and stress gain"
