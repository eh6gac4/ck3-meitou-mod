l_english:
 meitou_higekiri_name:0 "Higekiri"
 meitou_higekiri_desc:0 "A celebrated sword handed down in the Minamoto clan."
 meitou_hizamaru_name:0 "Hizamaru"
 meitou_hizamaru_desc:0 "A celebrated companion to Higekiri, later known as Usumidori."
 meitou_mikazuki_name:0 "Mikazuki Munechika"
 meitou_mikazuki_desc:0 "A graceful tachi attributed to Sanjo Munechika, with crescent moons shimmering in its temper pattern. Its beauty lends quiet prestige to its bearer."
 meitou_dojigiri_name:0 "Dojigiri Yasutsuna"
 meitou_dojigiri_desc:0 "A tachi attributed to Yasutsuna of Hoki. Tales claim that its edge can fell an oni, lending courage to those who wield it."
 meitou_ookanehira_name:0 "Ookanehira"
 meitou_ookanehira_desc:0 "A magnificent great tachi attributed to Kanehira of Bizen. Its imposing yet balanced form inspires both its bearer and those who follow them into battle."
 meitou_travel.leave:0 "Continue my journey for now"
 meitou_travel.withdraw:0 "Leave the sword in its keeper's care"
 meitou_travel.failure_end:0 "Perhaps another time"
 meitou_travel.unavailable:0 "The circumstances have changed"
 meitou_travel.0999.t:0 "An Unfulfilled Promise"
 meitou_travel.0999.desc:0 "Before the agreement could be completed, its terms changed. The sword may have found another keeper, or the necessary funds are no longer available. No payment or blade changes hands; I return to my journey."
 meitou_travel.0999.a:0 "If fortune allows, another time"
 meitou_travel.0001.t:0 "Night at the Bridge"
 meitou_travel.0001.desc:0 "At dusk, travelers hesitate before a bridge haunted by a threatening figure. An old warrior among them unwraps a sword: Higekiri, also called Onikiri in a tale of a warrior named Tsuna severing an oni's arm.\n\nThe old man cares less about proving that story than about getting these people across tonight. He is looking for someone worthy of the blade."
 meitou_travel.0001.a:0 "I will see the travelers safely across"
 meitou_travel.0101.t:0 "Behind the Name of an Oni"
 meitou_travel.0101.desc:0 "A hooded figure demands money at the bridge. Human or demon, it stands between the travelers and safety. The old warrior watches as I step forward.\n\nI could open the road by force, persuade the gathering to stand together, or fund lamps and a night watch. The sword's keeper will judge what I do for these people."
 meitou_travel.0101.a:0 "Stand between the figure and the travelers (Prowess 12+: 80%; otherwise: 45%)"
 meitou_travel.0101.b:0 "Rally the travelers and negotiate safe passage (Diplomacy 12+: 80%; otherwise: 45%)"
 meitou_travel.0101.c:0 "Provide lamps and a night watch (45 gold; certain)"
 meitou_travel.0201.t:0 "Keeper of Onikiri"
 meitou_travel.0201.desc:0 "By sunrise, the travelers have crossed safely. Their accounts of the night differ, but the road is open again.\n\nThe old warrior offers me Higekiri. He trusts what I did tonight more than any ancient tale. The blade rests easily in my hand; the responsibility it carries does not."
 meitou_travel.0201.a:0 "I will be worthy of its name"
 meitou_travel.0301.t:0 "Beyond the Mist"
 meitou_travel.0301.desc:0 "The travelers turn back in confusion. The old warrior wraps his sword again without a word of reproach, which somehow makes the failure harder to bear.\n\nHigekiri remains in his care. Perhaps another journey will bring another chance to earn his trust."
 meitou_travel.0002.t:0 "The Pale Green Wrapping"
 meitou_travel.0002.desc:0 "At an inn, a family spreads out an old sword and a damaged account of its origins. One passage calls it Hizamaru; another, Usumidori. They say it is Higekiri's companion, handed down among the Minamoto.\n\nThe family must leave their home and cannot continue caring for it. Yet they dread seeing its names and stories reduced to a price."
 meitou_travel.0002.a:0 "Let me examine the sword and its record"
 meitou_travel.0102.t:0 "Two Names, One Memory"
 meitou_travel.0102.desc:0 "The record tells of Mitsunaka possessing two swords and of Hizamaru becoming known as Usumidori in Yoshitsune's hands. Some passages are barely legible.\n\nThe family does not need me to declare every tale proven. They need to know that someone will preserve what has been handed down."
 meitou_travel.0102.a:0 "Compare the fragments and trace the changing names (Learning 12+: 80%; otherwise: 45%)"
 meitou_travel.0102.b:0 "Listen to the family and promise to preserve their account (Diplomacy 12+: 80%; otherwise: 45%)"
 meitou_travel.0102.c:0 "Fund a careful copy and proper storage (40 gold; certain)"
 meitou_travel.0202.t:0 "A Sword That Keeps Its Names"
 meitou_travel.0202.desc:0 "The record is wrapped carefully and placed beside the sword in my keeping. Its stories remain stories, but I can now see the generations of care behind them.\n\nWhether I call it Hizamaru or Usumidori, the family asks only that I remember. I place both blade and record among my belongings."
 meitou_travel.0202.a:0 "I accept the blade and its stories"
 meitou_travel.0302.t:0 "The Record Closes"
 meitou_travel.0302.desc:0 "We cannot reach an understanding. The family closes the fragile record; discussion of the sword's value has done little to ease their fears about its future.\n\nThey will keep it for now. The pale green wrapping stays in my thoughts long after we part."
 meitou_travel.0003.t:0 "A Moon in a Box"
 meitou_travel.0003.desc:0 "At a roadside residence, I am invited to view a small collection of swords. The host reveals a slender tachi said to be Mikazuki Munechika, a work of the Sanjo smith.\n\nThe guests begin competing over its reputation and price. The host interrupts: the next keeper must first learn to look at the blade itself."
 meitou_travel.0003.a:0 "Borrow a lamp and study the blade"
 meitou_travel.0103.t:0 "Reading the Temper Pattern"
 meitou_travel.0103.desc:0 "As the light moves, small arcs appear within the temper pattern. The host asks why this sword bears the name Crescent Moon. Another guest recites rumors of famous owners, scarcely looking at the steel.\n\nI can explain what I see or express its beauty in words. The host also hopes its next keeper will maintain the sword and allow others to appreciate it."
 meitou_travel.0103.a:0 "Point out the crescent shapes within the temper pattern (Learning 12+: 80%; otherwise: 45%)"
 meitou_travel.0103.b:0 "Describe its beauty through the changing moon (Diplomacy 12+: 80%; otherwise: 45%)"
 meitou_travel.0103.c:0 "Endow its care and future viewings (80 gold; certain)"
 meitou_travel.0203.t:0 "The Moon in My Keeping"
 meitou_travel.0203.desc:0 "Satisfied, the host replaces Mikazuki Munechika in its box and offers it to me.\n\nI am asked to look beyond its famous name and sometimes turn its blade toward the light. I have gained both a remarkable sword and the duty of passing its beauty onward."
 meitou_travel.0203.a:0 "I will keep this moon bright"
 meitou_travel.0303.t:0 "Words That Fell Short"
 meitou_travel.0303.desc:0 "My response leaves the host unconvinced. An awkward silence follows before the sword returns to its box.\n\nIts keeper is not ready to part with it. The little moons I glimpsed in the lamplight stay with me on the road."
 meitou_travel.0004.t:0 "The Feast in the Mountains"
 meitou_travel.0004.desc:0 "Robbed travelers shelter below a mountain pass. The bandits call themselves oni and feast on stolen wine.\n\nA local keeper offers a sword attributed to Yasutsuna of Hoki. It is called Dojigiri after a legend of Minamoto no Yorimitsu defeating Shuten-doji at Mount Oe. If these present-day demons are human, the keeper says, human ingenuity should suffice."
 meitou_travel.0004.a:0 "Borrow the sword and scout the mountain road"
 meitou_travel.0104.t:0 "Before the Demons' Stronghold"
 meitou_travel.0104.desc:0 "Laughter and the smell of wine drift through the undergrowth. There are sentries, but the path beside the stolen goods is poorly watched.\n\nI could lead an organized assault, exploit the distraction of the feast, or hire guides and enough guards to secure the road and recover the goods methodically."
 meitou_travel.0104.a:0 "Secure the approaches and lead an assault (Martial 12+: 80%; otherwise: 45%)"
 meitou_travel.0104.b:0 "Exploit the distractions of their feast (Intrigue 12+: 80%; otherwise: 45%)"
 meitou_travel.0104.c:0 "Hire guides and guards to secure the road (60 gold; certain)"
 meitou_travel.0204.t:0 "A Blade Against Demons"
 meitou_travel.0204.desc:0 "The bandits scatter and the goods return to their owners. Future storytellers may count any number of demons; I remember the dark paths and the relief on the travelers' faces.\n\nWhen I return Dojigiri, its keeper presses it back into my hands. I have done more than repeat an old story, and the road will still need protecting."
 meitou_travel.0204.a:0 "I will carry it on the roads ahead"
 meitou_travel.0304.t:0 "Laughter in the Mountains"
 meitou_travel.0304.desc:0 "Our approach is discovered and we must retreat. We return to the foothills, checking that everyone is accounted for as the laughter fades behind us.\n\nThe keeper accepts the borrowed sword. Dojigiri cannot remain with me, but surviving this attempt leaves the possibility of another."
 meitou_travel.0005.t:0 "Parting with an Heirloom"
 meitou_travel.0005.desc:0 "At a roadside estate, the owner sorts old arms for sale. Expenses have mounted and the storehouse needs attention. One great tachi stands apart from the goods.\n\nIt is said to be Ookanehira, a work of Kanehira of Bizen. The owner looks along its impressive length: inheriting a treasure, he says, means more than borrowing its reputation."
 meitou_travel.0005.a:0 "Ask what future he wishes for the sword"
 meitou_travel.0105.t:0 "Worthy of the Long Signature"
 meitou_travel.0105.desc:0 "The owner draws my attention from the imposing blade to its inscription. Unlike the short Kanehira signature seen on other works, this one names both Bizen and its maker.\n\nHe will not simply accept the highest bid. I could explain how I would preserve it, demonstrate an understanding of its use, or help repair the estate and relieve the burden on his household."
 meitou_travel.0105.a:0 "Present a sustainable plan for its care and storage (Stewardship 12+: 80%; otherwise: 45%)"
 meitou_travel.0105.b:0 "Demonstrate its reach, balance, and use in battle (Martial 12+: 80%; otherwise: 45%)"
 meitou_travel.0105.c:0 "Support repairs to the estate and storehouse (60 gold; certain)"
 meitou_travel.0205.t:0 "The Heirloom's Next Chapter"
 meitou_travel.0205.desc:0 "The owner places Ookanehira in its long box with the household's notes on its care. Parting remains painful, but some of the tension leaves his face.\n\nAnyone can boast of a magnificent blade. I must now build a life worthy of having been entrusted with it."
 meitou_travel.0205.a:0 "I will be worthy of this signature"
 meitou_travel.0305.t:0 "The Storehouse Remains Closed"
 meitou_travel.0305.desc:0 "My explanation does not ease the owner's concerns. Ookanehira is returned to its box and carried away from the goods for sale.\n\nHe apologizes, but an heirloom's future cannot be settled in haste. Perhaps next time I will be better placed to earn his confidence."
 meitou_odenta_name:0 "Odenta Mitsuyo"
 meitou_odenta_desc:0 "A substantial tachi attributed to Mitsuyo of the Miike school. Passed through many hands, its commanding form lends prestige to its bearer."
 meitou_juzumaru_name:0 "Juzumaru Tsunetsugu"
 meitou_juzumaru_desc:0 "A tachi attributed to Tsunetsugu of the Aoe school. It has been treasured alongside a story of prayer beads wound about its hilt."
 meitou_onimaru_name:0 "Onimaru Kunitsuna"
 meitou_onimaru_desc:0 "A powerful tachi attributed to Kunitsuna of Awataguchi, accompanied by a legend of a blade that struck an oni."
 meitou_travel.0006.t:0 "Odenta in the Storehouse"
 meitou_travel.0006.desc:0 "At a roadside estate, I find a family preparing to repair its storehouse. They bring out a heavy tachi called Odenta Mitsuyo, said to be the work of Mitsuyo of Miike. Its records are damaged, and knowledge of its care is fading.\n\nThe owner hopes to entrust it to someone who can preserve it."
 meitou_travel.0006.a:0 "Ask to see the sword and its old records"
 meitou_travel.0106.t:0 "Why Open the Storehouse"
 meitou_travel.0106.desc:0 "The blade is imposing, but damp has reached its box. The owner warns that anyone drawn only by the famous name will fail the next generation.\n\nI could examine the blade and records, make a promise of continued care, or fund repairs to the storehouse and box."
 meitou_travel.0106.a:0 "Compare the blade with its records (Learning 12+: 80%; otherwise: 45%)"
 meitou_travel.0106.b:0 "Hear the family and promise to maintain it (Diplomacy 12+: 80%; otherwise: 45%)"
 meitou_travel.0106.c:0 "Pay to repair the storehouse and box (80 gold; certain)"
 meitou_travel.0206.t:0 "A Weight Passed On"
 meitou_travel.0206.desc:0 "The owner wraps the records and offers Odenta to me in its box. I feel the weight of the sword in my hands, and the weight of its future care as well."
 meitou_travel.0206.a:0 "I will preserve this blade for those who follow"
 meitou_travel.0306.t:0 "A Storehouse Still Closed"
 meitou_travel.0306.desc:0 "I cannot ease the owner's concerns. Odenta returns to its box and the back of the storehouse. Another journey may offer another chance to earn this trust."
 meitou_travel.0007.t:0 "The Sword Wrapped in Beads"
 meitou_travel.0007.desc:0 "At a temple near the road, monks discuss a damaged box and a tachi said to be Juzumaru Tsunetsugu. A story of prayer beads wound about its hilt survives, but its box and written history need care.\n\nThe monks seek someone who will preserve both blade and record."
 meitou_travel.0007.a:0 "Visit the temple and hear their concerns"
 meitou_travel.0107.t:0 "Protecting Blade and Prayer"
 meitou_travel.0107.desc:0 "The written record holds additions from different times. I should distinguish what can be known while respecting the people who preserved it.\n\nI could study the record, agree on its care with the monks, or provide a new copy and box."
 meitou_travel.0107.a:0 "Examine the dates and passages of the record (Learning 12+: 80%; otherwise: 45%)"
 meitou_travel.0107.b:0 "Hear the monks and promise careful keeping (Diplomacy 12+: 80%; otherwise: 45%)"
 meitou_travel.0107.c:0 "Provide a copied record and new box (70 gold; certain)"
 meitou_travel.0207.t:0 "Juzumaru Entrusted"
 meitou_travel.0207.desc:0 "The monks carefully wrap the tachi and its record and entrust them to me. Not every story about Juzumaru has been proved, but our promise to preserve them begins today."
 meitou_travel.0207.a:0 "I will care for both sword and record"
 meitou_travel.0307.t:0 "The Sword Stays at the Temple"
 meitou_travel.0307.desc:0 "After deliberation, the monks decide to keep Juzumaru at the temple for now. The box closes and the record returns to its shelf. On my next visit, I hope to offer a better plan."
 meitou_travel.0008.t:0 "The Night Watch for Onimaru"
 meitou_travel.0008.desc:0 "At a castle storehouse, I meet a keeper worried about thieves. Inside lies a tachi called Onimaru Kunitsuna. A tale says it struck an oni, but tonight the threats are a damaged lock and human footsteps.\n\nThe keeper wants to know whether I can be trusted with the blade."
 meitou_travel.0008.a:0 "Help guard the storehouse tonight"
 meitou_travel.0108.t:0 "The Shadow at the Wall"
 meitou_travel.0108.desc:0 "Footsteps halt outside, and a shadow moves along the rear wall. The keeper holds the sword and waits for my decision.\n\nI can lead a watch at the entrance, anticipate an escape route, or hire enough guards to secure the storehouse."
 meitou_travel.0108.a:0 "Lead the watch and secure the entrance (Martial 12+: 80%; otherwise: 45%)"
 meitou_travel.0108.b:0 "Read the escape route and set a trap (Intrigue 12+: 80%; otherwise: 45%)"
 meitou_travel.0108.c:0 "Hire guards to protect the storehouse (70 gold; certain)"
 meitou_travel.0208.t:0 "Keeper of Onimaru"
 meitou_travel.0208.desc:0 "By dawn the thieves are gone, and both storehouse and sword are safe. The keeper offers Onimaru to me. More than any old tale of demons, he trusts what I did to protect the blade tonight."
 meitou_travel.0208.a:0 "I will carry the sword entrusted to me"
 meitou_travel.0308.t:0 "Footsteps Fading Away"
 meitou_travel.0308.desc:0 "I fail to catch the shadow. The keeper closes the door with Onimaru still in his hands. The blade is safe, but he is not yet ready to entrust it to me. I return to the road and wait for another chance."
