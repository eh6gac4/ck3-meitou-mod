l_english:
 meitou_honed_blade_modifier:0 "Honed Blade"
 meitou_upgrade.0001.t:0 "Among the Swordsmiths"
 meitou_upgrade.0001.desc:0 "At a forge along my route, a renowned smith examines [meitou_upgrade_target.GetName]. A careful change in its finish could bring out more of the blade's strength.\n\nI could entrust the work to the smith or try it under their guidance."
 meitou_upgrade.0001.desc_kyo:0 "In the forges of Kyo, artisans versed in the capital's finest blades examine [meitou_upgrade_target.GetName]. One studies its curve and temper pattern, then suggests a finer angle for the polish.\n\nI could entrust the work to the smith or learn the technique and finish it myself."
 meitou_upgrade.0001.desc_oku:0 "The sound of hammers reaches the road through Oku in Bizen. A celebrated smith studies the steel of [meitou_upgrade_target.GetName] and shows me how its edge might be better finished.\n\nI could leave the blade in skilled hands or attempt the work with guidance."
 meitou_upgrade.0001.desc_kuboya:0 "In Kuboya of Bitchu, a smith familiar with the blades of nearby Aoe examines [meitou_upgrade_target.GetName]. The blade has subtle habits, the smith says; its finish calls for patience.\n\nI could entrust the work to the smith or follow their advice myself."
 meitou_upgrade.0001.desc_mii:0 "On reaching Mii in Chikugo, a local smith tests the balance of [meitou_upgrade_target.GetName]. A little work might bring its grip and edge into closer harmony.\n\nI could commission the smith or attempt the finishing work under their eye."
 meitou_upgrade.0001.a:0 "Entrust it to the smith (70 gold; guaranteed +1 Prowess)"
 meitou_upgrade.0001.b:0 "Finish it under the smith's guidance (Prowess 12+: 70%; otherwise: 40%)"
 meitou_upgrade.0001.c:0 "Leave it untouched for now"
 meitou_upgrade.0002.t:0 "A Keener Blade"
 meitou_upgrade.0002.desc:0 "The blade moves more naturally in my hand. Its storied past has not changed, but I can now draw a little more from it."
 meitou_upgrade.0003.t:0 "An Unfinished Edge"
 meitou_upgrade.0003.desc:0 "Despite my efforts, the finish is not right. I stop before risking damage to the sword. The frustration lingers; the blade remains unharmed."
 meitou_upgrade.0004.t:0 "Plans Overtaken"
 meitou_upgrade.0004.desc:0 "Before the work could begin, the sword left my possession. No payment changes hands."
 meitou_upgrade.end:0 "Sheathe the blade"
