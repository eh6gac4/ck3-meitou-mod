l_english:
 meitou_honed_blade_modifier:0 "Honed Blade"
 meitou_upgrade.0001.t:0 "A Finer Edge"
 meitou_upgrade.0001.desc:0 "I hold [meitou_upgrade_target.GetName] up to the light. Its edge remains keen, yet careful work could bring out more of the blade's strength.\n\nI could entrust it to an expert polisher, tend it myself, or leave it as it is."
 meitou_upgrade.0001.a:0 "Hire an expert (70 gold; guaranteed +1 Prowess)"
 meitou_upgrade.0001.b:0 "Work on the blade myself (Prowess 12+: 70%; otherwise: 40%)"
 meitou_upgrade.0001.c:0 "Leave it untouched for now"
 meitou_upgrade.0002.t:0 "A Keener Blade"
 meitou_upgrade.0002.desc:0 "The blade moves more naturally in my hand. Its storied past has not changed, but I can now draw a little more from it."
 meitou_upgrade.0003.t:0 "An Unfinished Edge"
 meitou_upgrade.0003.desc:0 "Despite my efforts, the finish is not right. I stop before risking damage to the sword. The frustration lingers; the blade remains unharmed."
 meitou_upgrade.0004.t:0 "Plans Overtaken"
 meitou_upgrade.0004.desc:0 "Before the work could begin, the sword left my possession or had already received the care it needed. No payment changes hands."
 meitou_upgrade.end:0 "Sheathe the blade"
