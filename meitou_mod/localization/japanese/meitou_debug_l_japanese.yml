l_japanese:
 meitou_debug_decision:0 "名刀イベントのデバッグ"
 meitou_debug_decision_desc:0 "刀を選んでイベントを試します。通常の入手や負担も発生するため、検証用セーブで使ってください。"
 meitou_debug_decision_tooltip:0 "名刀デバッグメニューを開く"
 meitou_debug_decision_confirm:0 "開く"
 meitou_debug.0001.t:0 "名刀イベントのデバッグ"
 meitou_debug.0001.desc:0 "試す刀を選んでください。旅行せずに導入や試練を開けます。結末だけの表示では報酬や負担は発生しません。\n\n実際の試練と強制成功・失敗は、刀の入手記録やストレスを変更します。イベントは一つずつ閉じてから次を試してください。"
 meitou_debug.close:0 "閉じる"
 meitou_debug.back:0 "刀の選択へ戻る"
 meitou_debug.intro:0 "導入から試す（未入手の刀のみ）"
 meitou_debug.trial:0 "試練を開く（実際に報酬・負担が発生）"
 meitou_debug.success_preview:0 "成功の文章だけを見る"
 meitou_debug.failure_preview:0 "失敗の文章だけを見る"
 meitou_debug.reset:0 "180日待機のリセットへ"
 meitou_debug.reset_confirm:0 "180日待機を解除する"
 meitou_debug.cancel:0 "リセットせず戻る"
 meitou_debug.gold:0 "検証用に100金を追加する"
 meitou_debug.force_success:0 "［デバッグ］入手成功を実行する"
 meitou_debug.force_failure:0 "［デバッグ］失敗とストレス増加を実行する"
 meitou_debug.choose_higekiri:0 "髭切"
 meitou_debug.choose_hizamaru:0 "膝丸"
 meitou_debug.choose_mikazuki:0 "三日月宗近"
 meitou_debug.choose_dojigiri:0 "童子切安綱"
 meitou_debug.choose_ookanehira:0 "大包平"
 meitou_debug.0101.t:0 "髭切：イベント検証"
 meitou_debug.0101.desc:0 "導入は場所・旅行状態・再発待ちを一回だけ無視します。入手済みの刀は再び生成できません。繰り返す場合は入手前のセーブを読み込んでください。\n\n試練を直接開くと、入手済みの場合の終了処理も確認できます。成功・失敗の文章だけを見る操作はセーブの状態を変更しません。"
 meitou_debug.0201.t:0 "髭切：再発待ちのリセット"
 meitou_debug.0201.desc:0 "操作中の人物の180日待機だけを解除します。世界共通の入手済み記録と既存の宝物は保持します。入手後の再生成はできません。繰り返し試す場合は入手前のセーブを読み込んでください。"
 meitou_debug.0102.t:0 "膝丸：イベント検証"
 meitou_debug.0102.desc:0 "導入は場所・旅行状態・再発待ちを一回だけ無視します。入手済みの刀は再び生成できません。繰り返す場合は入手前のセーブを読み込んでください。\n\n試練を直接開くと、入手済みの場合の終了処理も確認できます。成功・失敗の文章だけを見る操作はセーブの状態を変更しません。"
