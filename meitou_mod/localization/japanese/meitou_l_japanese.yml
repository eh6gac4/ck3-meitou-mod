l_japanese:
 meitou_higekiri_name:0 "髭切"
 meitou_higekiri_desc:0 "源氏の重宝と伝わる太刀。幾度も名を変え、武家の威信を示してきた。"
 meitou_hizamaru_name:0 "膝丸"
 meitou_hizamaru_desc:0 "髭切と対をなすと伝わる太刀。後世には薄緑の名でも知られる。"
 meitou_mikazuki_name:0 "三日月宗近"
 meitou_mikazuki_desc:0 "刃文に三日月を浮かべる、三条宗近の作と伝わる太刀。その優美な姿は、持ち主の威信を静かに物語る。"
 meitou_dojigiri_name:0 "童子切安綱"
 meitou_dojigiri_desc:0 "伯耆の刀工・安綱の作と伝わる太刀。鬼をも断つという伝承をまとい、その鋭い刃は持ち主に勇気を与える。"
 meitou_ookanehira_name:0 "大包平"
 meitou_ookanehira_desc:0 "備前の刀工・包平の作と伝わる、堂々たる大太刀。力強さと美しさを兼ね備え、戦場では従う者たちを鼓舞する。"
 meitou_travel.leave:0 "今は旅を続けよう"
 meitou_travel.withdraw:0 "ここまでにして、刀を預けて立ち去る"
 meitou_travel.failure_end:0 "いつか、もう一度"
 meitou_travel.unavailable:0 "話が変わったようだ"
 meitou_travel.0999.t:0 "果たされなかった約束"
 meitou_travel.0999.desc:0 "話を進める間に、譲渡の条件が変わってしまった。刀には別の引き取り手が決まったか、約束の費用を用意できなくなったようだ。今回は刀も代金も動かさず、旅へ戻ることにする。"
 meitou_travel.0999.a:0 "縁があれば、また"
 meitou_travel.0001.t:0 "戻り橋の夜"
 meitou_travel.0001.desc:0 "夕暮れの街道で、橋を前に足を止めた一行に出会った。夜ごと旅人を脅かす影が現れるという。同行する老武者は、布に包んだ太刀を見せる。髭切――綱という武者が橋で鬼の腕を断ち、鬼切とも呼ばれたと語られる刀だ。\n\n「話の真偽より、今夜ここを渡れぬ者たちが気がかりでな」。老武者は、刀を託すに足る人物を探しているらしい。"
 meitou_travel.0001.a:0 "夜の橋に立ち、人々を送り届けよう"
 meitou_travel.0101.t:0 "鬼の名を借りる者"
 meitou_travel.0101.desc:0 "橋のたもとで、頭巾をかぶった影が通行人に銭を要求している。鬼なのか、人なのか。老武者は髭切の柄に手を添えるが、先に動いたのはこちらだった。\n\n力で道を開くか、争いを収めるか。あるいは自費で夜警を整え、誰も一人で渡らずに済むようにするか。老武者が見ているのは、刀を欲しがる声の大きさではない。"
 meitou_travel.0101.a:0 "前に出る。旅人に手を出させはしない（武勇12以上：成功80%、未満：45%）"
 meitou_travel.0101.b:0 "人々をまとめ、通行を妨げぬよう説得する（外交12以上：成功80%、未満：45%）"
 meitou_travel.0101.c:0 "夜警と灯火を手配する（45金・確実）"
 meitou_travel.0201.t:0 "鬼切を預かる者"
 meitou_travel.0201.desc:0 "朝日が水面を照らすころ、人々は無事に向こう岸へ渡り終えていた。夜の影が何者だったか、語る者ごとに話は違う。だが、道が再び開かれたことだけは確かだ。\n\n老武者は髭切を差し出した。「鬼を斬ったという昔話より、人を守った今夜の働きを信じよう」。受け取った刀は、伝説の重さとは裏腹に手によくなじんだ。"
 meitou_travel.0201.a:0 "名に恥じぬよう、この刀を帯びよう"
 meitou_travel.0301.t:0 "霧の向こうへ"
 meitou_travel.0301.desc:0 "騒ぎの中で人々は引き返し、夜の橋には誰も残らなかった。老武者は刀を布で包み直す。こちらを責める言葉はない。それがかえって胸に重い。\n\n「今夜は縁がなかった」。髭切はまだ彼の手にある。いつか再び、その信頼を得る機会もあるだろう。"
 meitou_travel.0002.t:0 "薄緑の包み"
 meitou_travel.0002.desc:0 "旅の宿で、一家が古い太刀と傷んだ由緒書を広げていた。紙には「膝丸」、別の箇所には「薄緑」。家人によれば、髭切と対をなし、源氏に伝わった刀だという。\n\n家を離れることになり、刀を守り続ける余裕はない。それでも名も来歴も忘れられ、ただの売り物になるのは忍びないと、若い家人が包みを握りしめている。"
 meitou_travel.0002.a:0 "刀と由緒書を見せてもらおう"
 meitou_travel.0102.t:0 "二つの名、一つの記憶"
 meitou_travel.0102.desc:0 "由緒書には、満仲が二振りの刀を持ったという話と、義経の手で膝丸が薄緑と呼ばれるようになったという話が記されている。しかし紙は傷み、読みづらい箇所も多い。\n\n家人が望んでいるのは、名高い誰かの所有をこちらが断言することではない。この刀がどのように語り継がれてきたのか、それを絶やさぬ約束だ。"
 meitou_travel.0102.a:0 "断片を読み合わせ、伝わる名の移り変わりを整理する（学識12以上：成功80%、未満：45%）"
 meitou_travel.0102.b:0 "一家の記憶を聞き取り、刀とともに受け継ぐと誓う（外交12以上：成功80%、未満：45%）"
 meitou_travel.0102.c:0 "書写と保管の費用を引き受ける（40金・確実）"
 meitou_travel.0202.t:0 "名を失わぬ刀"
 meitou_travel.0202.desc:0 "由緒書は丁寧に包み直され、太刀と一緒にこちらへ渡された。伝承のすべてを確かめられたわけではない。それでも、異なる名の向こうに、この刀を守ってきた人々の思いが見える。\n\n「膝丸でも、薄緑でも。どうか忘れずに」。家人の言葉を聞きながら、刀を旅の荷へ大切に収めた。"
 meitou_travel.0202.a:0 "刀も、その物語も預かろう"
 meitou_travel.0302.t:0 "閉じられた由緒書"
 meitou_travel.0302.desc:0 "話はかみ合わず、家人は由緒書を閉じた。刀の値打ちについて言葉を尽くしても、守ってきた記憶への不安は消えない。\n\n一家は当面、太刀を手元に置くことにした。別れ際に見た薄緑の包みが、いつまでも心に残った。"
 meitou_travel.0003.t:0 "箱の中の月"
 meitou_travel.0003.desc:0 "街道沿いの屋敷で、小さな刀の鑑賞会に招かれた。主人が箱を開くと、細身の太刀が現れる。三条宗近の作と伝わる三日月宗近だという。\n\n集まった客は大きな名に色めき立つ。しかし主人は、値を競う声を静かに制した。「お譲りするなら、この刀をよく見てくださる方に」。"
 meitou_travel.0003.a:0 "灯火を借り、刀身に向き合う"
 meitou_travel.0103.t:0 "刃文を読む"
 meitou_travel.0103.desc:0 "光の角度を変えると、刃文の中に小さな弧がいくつも浮かぶ。主人は、なぜこの刀を三日月と呼ぶのかと尋ねた。隣の客は名高い持ち主の噂ばかり並べ、刀身そのものには目を向けようとしない。\n\n見えるものを丁寧に述べるか、美しさを言葉にして伝えるか。主人は今後も刀を人々に見せ、手入れしてくれる持ち主を望んでいる。"
 meitou_travel.0103.a:0 "刃文に浮かぶ三日月形を一つずつ指し示す（学識12以上：成功80%、未満：45%）"
 meitou_travel.0103.b:0 "月の移ろいにたとえ、刀の美しさを語る（外交12以上：成功80%、未満：45%）"
 meitou_travel.0103.c:0 "手入れと鑑賞の場を支える（80金・確実）"
 meitou_travel.0203.t:0 "手の中に残る月"
 meitou_travel.0203.desc:0 "主人は納得したようにうなずき、三日月宗近を箱に戻した。その箱が、今度はこちらへ差し出される。\n\n「名の大きさばかりを追わず、どうか時折、光にかざしてください」。刃文に宿る小さな月を思い浮かべる。手に入れたのは名声だけではなく、この美しさを次へ渡す役目でもある。"
 meitou_travel.0203.a:0 "この月を曇らせはしない"
 meitou_travel.0303.t:0 "届かなかった言葉"
 meitou_travel.0303.desc:0 "主人の問いにうまく応えられず、席には気まずい沈黙が残った。やがて三日月宗近は静かに箱へ戻される。\n\n持ち主を替える決心はつかなかったようだ。灯火の中で見えた刃の月だけが、帰り道にも脳裏を離れない。"
 meitou_travel.0004.t:0 "山の酒宴"
 meitou_travel.0004.desc:0 "峠の麓で、荷を奪われた旅人たちが身を寄せていた。山賊は自らを鬼と称し、奪った酒で夜ごと宴を開くという。\n\n土地の刀守は、伯耆の安綱が鍛えたと伝わる太刀を差し出した。源頼光が大江山の酒呑童子を討った刀だという伝説から、童子切と呼ばれている。「今の山にいる鬼が人ならば、人の知恵で退けられるはずだ」。"
 meitou_travel.0004.a:0 "刀を借り、山道の様子を探る"
 meitou_travel.0104.t:0 "鬼の砦を前に"
 meitou_travel.0104.desc:0 "藪の向こうから笑い声と酒の匂いが流れてくる。山賊たちは見張りを置いているが、荷を積んだ小道の守りは薄い。襲撃の時機を選ぶ余地はありそうだ。\n\n正面から統制の取れた攻めを仕掛けるか、宴の隙を利用して追い払うか。案内人と十分な護衛を雇えば、退路を確保しながら手堅く荷を取り戻せる。"
 meitou_travel.0104.a:0 "見張りを押さえ、隊を率いて踏み込む（軍事12以上：成功80%、未満：45%）"
 meitou_travel.0104.b:0 "宴に気を取られた隙を突く（策略12以上：成功80%、未満：45%）"
 meitou_travel.0104.c:0 "案内人と護衛を雇い、道を封じる（60金・確実）"
 meitou_travel.0204.t:0 "鬼を退けた刃"
 meitou_travel.0204.desc:0 "山賊は持ち場を捨て、奪われた荷は持ち主へ戻った。後にこの夜を語る者が、何人の鬼を数えるのかはわからない。こちらが覚えているのは、暗い山道と、戻ってきた荷を抱く人々の顔だ。\n\n刀守は返された童子切を押し戻した。「物語をなぞるだけではなかったな」。この刀を、これからも道を守るために帯びてほしいという。"
 meitou_travel.0204.a:0 "次の旅路にも、この刀を携えよう"
 meitou_travel.0304.t:0 "山に残る笑い声"
 meitou_travel.0304.desc:0 "動きを悟られ、山道から退かざるを得なくなった。仲間の無事を確かめながら麓へ戻るころ、宴の笑い声は遠くに消えていた。\n\n借りた刀を返すと、刀守は短くうなずいた。童子切は預けたままにはできないが、生きて戻った以上、やり直す機会は残っている。"
 meitou_travel.0005.t:0 "家宝を手放す日"
 meitou_travel.0005.desc:0 "街道沿いの屋敷で、主人が古い武具の整理をしていた。家の出費がかさみ、蔵の手入れもままならないという。それでも一振りの大太刀だけは、売り物の列から離して置かれている。\n\n備前の包平の作と伝わる大包平。主人は長い刀身を眺め、「家宝を受け継ぐとは、名だけを借りることではない」とつぶやいた。"
 meitou_travel.0005.a:0 "家宝の行く末について話を聞こう"
 meitou_travel.0105.t:0 "長い銘にふさわしく"
 meitou_travel.0105.desc:0 "刀身の堂々とした姿に目を奪われるが、主人は銘にも注目してほしいという。短く包平と切る作とは異なり、そこには「備前国包平作」と長く刻まれている。\n\n彼は高値をつけた者へ無条件に渡すつもりはない。保管と手入れを続ける見通しを示すか、戦でこの大太刀を扱う理解を示すか。屋敷の修繕を助け、家の負担を軽くする道もある。"
 meitou_travel.0105.a:0 "手入れと保管に無理のない計画を示す（管理12以上：成功80%、未満：45%）"
 meitou_travel.0105.b:0 "間合いと重心を確かめ、大太刀の扱いを示す（軍事12以上：成功80%、未満：45%）"
 meitou_travel.0105.c:0 "蔵と屋敷の修繕を支援する（60金・確実）"
 meitou_travel.0205.t:0 "家宝の次の章"
 meitou_travel.0205.desc:0 "主人は大包平を長い箱へ収め、代々の手入れの覚え書きを添えた。刀を手放す寂しさは消えないだろう。それでも、その表情から張りつめたものが少し抜けた。\n\n刃の立派さを誇るだけなら誰にでもできる。これからは、この太刀を受け継ぐに足る日々を積み重ねなければならない。"
 meitou_travel.0205.a:0 "この銘に恥じぬ持ち主になろう"
 meitou_travel.0305.t:0 "まだ開かぬ蔵"
 meitou_travel.0305.desc:0 "こちらの説明では、主人の不安を払えなかった。大包平は箱へ戻され、売り物とは別の蔵に運ばれていく。\n\n主人は申し訳なさそうに頭を下げた。家宝を誰に託すかは、今すぐ決められることではない。次に会うときには、もう少し信頼に足る姿を見せたいものだ。"
