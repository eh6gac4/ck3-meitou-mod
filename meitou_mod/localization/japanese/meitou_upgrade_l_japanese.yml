l_japanese:
 meitou_honed_blade_modifier:0 "研ぎ澄まされた刃"
 meitou_upgrade.0001.t:0 "名刀の研ぎ直し"
 meitou_upgrade.0001.desc:0 "[meitou_upgrade_target.GetName]を手に取り、刀身を灯火にかざす。刃の鋭さは失われていないが、丁寧に研ぎ直せばさらに扱いやすくなるだろう。\n\n腕の立つ研師に任せるか、自ら刃の癖を見極めて手を入れるか。今は見送ることもできる。"
 meitou_upgrade.0001.a:0 "研師に預ける（70金・確実に武勇＋1）"
 meitou_upgrade.0001.b:0 "自ら刃を整える（武勇12以上：成功70%、未満：40%）"
 meitou_upgrade.0001.c:0 "今は手を加えない"
 meitou_upgrade.0002.t:0 "冴える刃"
 meitou_upgrade.0002.desc:0 "手入れを終えた刀を静かに振る。わずかな重さの偏りが整い、刃の動きが手になじむ。名刀の由緒は変わらないが、その力を以前より確かに引き出せる。"
 meitou_upgrade.0003.t:0 "届かぬ手入れ"
 meitou_upgrade.0003.desc:0 "手を尽くしたものの、仕上がりには納得できない。刀を傷める前に作業を止める。苛立ちは残るが、刃の力は失われていない。"
 meitou_upgrade.0004.t:0 "行き違った刀"
 meitou_upgrade.0004.desc:0 "手入れの段取りを決める間に、刀は手元から離れたか、すでに十分な手入れを受けていた。費用を払わず、今回は見送る。"
 meitou_upgrade.end:0 "刀を納めよう"
