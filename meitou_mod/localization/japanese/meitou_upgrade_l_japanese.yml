l_japanese:
 meitou_honed_blade_modifier:0 "研ぎ澄まされた刃"
 meitou_upgrade.0001.t:0 "刀工の里で"
 meitou_upgrade.0001.desc:0 "旅先の鍛冶場で名高い刀工が[meitou_upgrade_target.GetName]の刃を見た。手入れの仕方を変えれば、刀はさらに手になじむという。\n\n職人に任せるか、その助言を受けて自ら手を入れるか。"
 meitou_upgrade.0001.desc_kyo:0 "京の鍛冶場には、都の名工たちの仕事を知る職人が集まる。ひとりが[meitou_upgrade_target.GetName]の反りと刃文を見て、研ぎの角度を少し変えるよう勧めた。\n\n職人に任せるか、その手つきを学んで自ら仕上げるか。"
 meitou_upgrade.0001.desc_oku:0 "備前の邑久に入ると、炉の火と槌音が街道まで届いた。名高い刀工が[meitou_upgrade_target.GetName]の地鉄を見て、刃を生かす研ぎ方を示す。\n\n職人に任せるか、その技を教わって自ら手を動かすか。"
 meitou_upgrade.0001.desc_kuboya:0 "備中の窪屋では、青江の地に通じる刀工が[meitou_upgrade_target.GetName]を丁寧に見た。刃の細かな癖を読み、急がず整えるべきだと助言する。\n\n職人に任せるか、助言に従って自ら研ぐか。"
 meitou_upgrade.0001.desc_mii:0 "筑後の三井を訪れると、この地の刀工が[meitou_upgrade_target.GetName]の重心を確かめた。握りと刃の動きが自然につながるよう、わずかな手入れを提案する。\n\n職人に任せるか、その見立てを頼りに自ら仕上げるか。"
 meitou_upgrade.0001.b:0 "教わりながら自ら仕上げる（武勇12以上：成功70%、未満：40%）"
 meitou_upgrade.0001.c:0 "今は手を加えない"
 meitou_upgrade.0002.t:0 "冴える刃"
 meitou_upgrade.0002.desc:0 "手入れを終えた刀を静かに振る。わずかな重さの偏りが整い、刃の動きが手になじむ。名刀の由緒は変わらないが、その力を以前より確かに引き出せる。"
 meitou_upgrade.0003.t:0 "届かぬ手入れ"
 meitou_upgrade.0003.desc:0 "手を尽くしたものの、仕上がりには納得できない。刀を傷める前に作業を止める。苛立ちは残るが、刃の力は失われていない。"
 meitou_upgrade.0004.t:0 "行き違った刀"
 meitou_upgrade.0004.desc:0 "手入れの段取りを決める間に、刀が手元から離れたか、刀はすでに研磨の限界まで仕上がっていた。費用を払わず、今回は見送る。"
 meitou_upgrade.end:0 "刀を納めよう"
 meitou_upgrade.0001.a1:0 "刀工に預ける（70金・研磨Ⅰへ確実に強化）"
 meitou_upgrade.0001.a2:0 "刀工に預ける（120金・研磨Ⅱへ確実に強化）"
 meitou_upgrade.0001.a3:0 "刀工に預ける（200金・研磨Ⅲへ確実に強化）"
